# Supabase local/project config (bridge + MCP + OAuth gateway).

[functions.jules-orchestrator]
# Service-to-service auth uses ORCHESTRATOR_SHARED_SECRET (Bearer).
verify_jwt = false

[functions.jules-mcp]
# Remote MCP for static Bearer MCP_SHARED_SECRET.
verify_jwt = false

[functions.jules-mcp-oauth]
# OAuth 2.1/PKCE gateway for Claude/Grok connectors; proxies to jules-mcp.
verify_jwt = false

[functions.jules-mcp]
# Remote MCP for Grok/xAI. Auth: Authorization Bearer MCP_SHARED_SECRET.
# JWT gate disabled; MCP clients are not Supabase end-users.
verify_jwt = false
