# Continuous integration for DR DHL Elite Fitness Club
# Required gate for Jules production auto-merge (see auto-merge-jules.yml).
name: CI

on:
  pull_request:
    branches:
      - scaffold-gymsmart-erp-9743545895368865022
  push:
    branches:
      - scaffold-gymsmart-erp-9743545895368865022

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint-typecheck-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          # Build must not require live secrets; app should tolerate missing env at build time.
          NEXT_TELEMETRY_DISABLED: "1"
