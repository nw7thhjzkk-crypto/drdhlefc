name: Jules

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  jules:
    if: |
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && startsWith(github.event.comment.body, '@jules')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify triggering user is repo owner
        run: |
          if [ "${{ github.triggering_actor }}" != "${{ github.repository_owner }}" ]; then
            echo "Error: Only the repository owner can trigger Jules."
            bash -c 'exit 1'
          fi

      - name: Invoke Jules
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules-api-key: ${{ secrets.JULES_API_KEY }}
