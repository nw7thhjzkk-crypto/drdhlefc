name: Deploy jules-mcp-oauth (manual)

# High-risk production deploy. workflow_dispatch only — never on push/PR merge.
# Deploys hardened jules-mcp-oauth from fixed PR #86 source SHA only.
# Does NOT run supabase db push (remote migration history uses timestamp
# versions not present in the sequential Git migration tree — see Actions
# run 34057223122). Schema for 000011 must already exist or be applied
# out-of-band; this workflow only verifies tables read-only then deploys
# the Edge Function.
#
# Table probe fix (run 34057783217): install postgresql-client + sslmode=require;
# fallback is `supabase db query --linked` (not `db execute`).

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: >
          Exact git SHA of jules-mcp-oauth sources (must be PR #86 hardened head
          66e009b1e84c38a582e9e7330d3185ca944cb4e5 unless intentionally updated).
        required: true
        type: string
      confirm_production:
        description: Type exactly deploy-jules-mcp-oauth-production to proceed
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: "66e009b1e84c38a582e9e7330d3185ca944cb4e5"
  SUPABASE_PROJECT_REF: "ahkwooaqayqikvotwuac"
  FUNCTION_NAME: "jules-mcp-oauth"

jobs:
  deploy:
    name: Preflight + deploy jules-mcp-oauth (no db push)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fail closed — confirmation phrase
        if: ${{ inputs.confirm_production != 'deploy-jules-mcp-oauth-production' }}
        run: |
          echo "Refusing deploy: confirm_production must be exactly deploy-jules-mcp-oauth-production"
          exit 1

      - name: Fail closed — source SHA pin (PR #86 hardened)
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          INPUT_SHA="$(echo "$INPUT_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          EXPECTED="${EXPECTED_SOURCE_SHA}"
          if [ "$INPUT_SHA" != "$EXPECTED" ]; then
            echo "Refusing deploy: source_sha must equal $EXPECTED (got: $INPUT_SHA)"
            exit 1
          fi
          echo "Source SHA pin OK: $EXPECTED"

      - name: Checkout pinned source SHA only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1

      - name: Preflight — required paths exist at pinned SHA
        run: |
          set -euo pipefail
          test -f supabase/functions/jules-mcp-oauth/index.ts
          test -f supabase/migrations/000011_jules_mcp_oauth.sql
          HEAD_SHA="$(git rev-parse HEAD)"
          case "$HEAD_SHA" in
            ${EXPECTED_SOURCE_SHA}*) echo "Checked-out HEAD matches pin: $HEAD_SHA" ;;
            *) echo "Checked-out HEAD $HEAD_SHA does not match pin ${EXPECTED_SOURCE_SHA}"; exit 1 ;;
          esac
          grep -q jules_mcp_oauth_clients supabase/migrations/000011_jules_mcp_oauth.sql
          grep -q jules_mcp_oauth_codes supabase/migrations/000011_jules_mcp_oauth.sql
          grep -q jules_mcp_oauth_refresh_tokens supabase/migrations/000011_jules_mcp_oauth.sql

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install postgresql-client (read-only probe)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Link project (no schema changes)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing GitHub secret SUPABASE_DB_PASSWORD (required for read-only table preflight)"
            exit 1
          fi
          PROJECT_REF="${SUPABASE_PROJECT_ID:-$SUPABASE_PROJECT_REF}"
          if [ "$PROJECT_REF" != "ahkwooaqayqikvotwuac" ]; then
            echo "Refusing deploy: project ref must be ahkwooaqayqikvotwuac"
            exit 1
          fi
          # Link only — do not db push / repair / pull
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          echo "Project linked (no migration commands run)."

      - name: Preflight — OAuth tables exist (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          PROJECT_REF="${SUPABASE_PROJECT_ID:-$SUPABASE_PROJECT_REF}"
          if [ "$PROJECT_REF" != "ahkwooaqayqikvotwuac" ]; then
            echo "Refusing deploy: project ref must be ahkwooaqayqikvotwuac"
            exit 1
          fi

          # Read-only SQL only — no DDL/DML.
          READ_SQL="SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('jules_mcp_oauth_clients','jules_mcp_oauth_codes','jules_mcp_oauth_refresh_tokens') ORDER BY tablename;"

          FOUND=""
          DB_HOST="db.${PROJECT_REF}.supabase.co"

          # Primary: psql with explicit SSL (postgresql-client installed above).
          # Password via PGPASSWORD env — not printed; not in process argv string beyond env.
          if command -v psql >/dev/null 2>&1; then
            FOUND="$(psql "host=${DB_HOST} port=5432 dbname=postgres user=postgres sslmode=require" \
              -v ON_ERROR_STOP=1 -tAc "$READ_SQL" 2>/tmp/oauth_preflight_err || true)"
          fi

          # Fallback: supabase db query --linked (verified CLI subcommand; not db execute).
          # Syntax: supabase db query "SELECT ..." --linked
          if [ -z "${FOUND//[[:space:]]/}" ]; then
            FOUND="$(supabase db query "$READ_SQL" --linked 2>/tmp/oauth_preflight_err || true)"
          fi

          if [ -z "${FOUND//[[:space:]]/}" ]; then
            echo "FAIL CLOSED: cannot verify OAuth tables with available CI credentials/CLI."
            echo "Do not deploy until public.jules_mcp_oauth_clients,"
            echo "public.jules_mcp_oauth_codes, and public.jules_mcp_oauth_refresh_tokens exist."
            echo "Apply 000011_jules_mcp_oauth.sql out-of-band (Dashboard SQL / controlled apply),"
            echo "then re-run this workflow. This job does not run migration repair, db push, or db pull."
            if [ -f /tmp/oauth_preflight_err ]; then
              grep -viE 'password|token|secret|bearer|api.key' /tmp/oauth_preflight_err | tail -n 30 || true
            fi
            exit 1
          fi

          echo "Tables reported by read-only probe:"
          echo "$FOUND"

          echo "$FOUND" | grep -q 'jules_mcp_oauth_clients' || { echo "Missing jules_mcp_oauth_clients"; exit 1; }
          echo "$FOUND" | grep -q 'jules_mcp_oauth_codes' || { echo "Missing jules_mcp_oauth_codes"; exit 1; }
          echo "$FOUND" | grep -q 'jules_mcp_oauth_refresh_tokens' || { echo "Missing jules_mcp_oauth_refresh_tokens"; exit 1; }

          echo "OAuth table preflight OK (read-only)."

      - name: Deploy Edge Function jules-mcp-oauth only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          PROJECT_REF="${SUPABASE_PROJECT_ID:-$SUPABASE_PROJECT_REF}"
          if [ "$PROJECT_REF" != "ahkwooaqayqikvotwuac" ]; then
            echo "Refusing deploy: project ref must be ahkwooaqayqikvotwuac"
            exit 1
          fi
          # Single function only — does not deploy jules-mcp or jules-orchestrator
          supabase functions deploy "$FUNCTION_NAME" \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
          echo "DEPLOY_STATUS=success"
          echo "FUNCTION_NAME=$FUNCTION_NAME"
          echo "PROJECT_REF=$PROJECT_REF"
          echo "SOURCE_SHA=$EXPECTED_SOURCE_SHA"
          echo "DB_PUSH=skipped (by design; migration history mismatch)"
          echo "Safe status only — secrets not printed."
