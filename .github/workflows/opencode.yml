name: OpenCode

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.issue.pull_request != null && startsWith(github.event.comment.body, '@opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify triggering user is repo owner
        run: |
          if [ "${{ github.triggering_actor }}" != "${{ github.repository_owner }}" ]; then
            echo "Error: Only the repository owner can trigger OpenCode."
            bash -c 'exit 1'
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OpenCode
        uses: google/opencode-github-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
