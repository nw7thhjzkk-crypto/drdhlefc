# OpenCode + Gemini automation for DR DHL Elite Fitness Club
# Trigger: comment /oc or /opencode on issues or PR review threads
# Restricted to repository owner only. Secrets are never echoed.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Only run for owner comments that mention /oc or /opencode
    if: |
      github.event.comment.user.login == 'nw7thhjzkk-crypto' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # GITHUB_TOKEN used by OpenCode in use_github_token mode
          persist-credentials: true

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.18.29
        env:
          # Existing repo secret (kept for compatibility)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # OpenCode Google provider expects this name
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Built-in token for commits/comments/PRs (no OpenCode GitHub App required)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.6-flash
          use_github_token: true
          # Avoid sharing session content for a public business repo
          share: "false"
