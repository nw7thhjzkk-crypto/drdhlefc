# OpenCode automation for DR DHL Elite Fitness Club
# Trigger: comment /oc or /opencode on issues or PR review threads
# Restricted to repository owner only. Secrets are never echoed.
#
# Model routing (cost target: $0):
# 1) OpenCode Zen free models (primary)
# 2) OpenRouter :free models (optional secret)
# 3) Groq free tier (optional secret)
# 4) Google Gemini free tier (optional / last resort)
# Failover between models is handled by project opencode.json
# (@shutovks/opencode-model-fallback). Missing provider secrets simply
# skip that lane when OpenCode cannot authenticate the provider.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Only run for owner comments that mention /oc or /opencode
    if: |
      github.event.comment.user.login == 'nw7thhjzkk-crypto' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.18.29
        env:
          # Built-in token for commits/comments/PRs (no OpenCode GitHub App required)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Optional: OpenCode Zen account key (free models work with $0 balance)
          # Create at https://opencode.ai (Zen). Leave unset to rely on anonymous free catalog when available.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

          # Optional: OpenRouter free-lane key (no card required for :free models)
          # https://openrouter.ai/keys
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # Optional: Groq free-tier key (no card required)
          # https://console.groq.com/keys
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # Optional last-resort Google free tier (strict per-model daily limits)
          # Reuses existing GEMINI_API_KEY secret when present
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          # Primary: OpenCode Zen free coding model (no paid Gemini dependency)
          model: opencode/big-pickle
          use_github_token: true
          share: "false"
