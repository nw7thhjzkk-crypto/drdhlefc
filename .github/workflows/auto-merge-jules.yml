# Guarded automatic merge for Jules-produced PRs only.
#
# Eligibility (ALL required):
# - Author is google-labs-jules[bot]
# - Head repo is this repository (not a fork)
# - Base is the production branch
# - CI workflow "CI" completed successfully for this head SHA
# - PR is mergeable (no conflicts)
# - High-risk paths are NOT modified (fail closed)
#
# Never merges arbitrary/manual/external PRs.
name: auto-merge-jules

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  maybe-automerge:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR for successful CI run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pulls = run.pull_requests || [];
            if (!pulls.length) {
              // workflow_run.pull_requests can be empty; look up by head SHA
              const { data: items } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${run.head_branch}`,
                per_page: 10,
              });
              const match = items.find(p => p.head.sha === run.head_sha);
              if (!match) {
                core.setFailed('No open PR found for successful CI run');
                return;
              }
              core.setOutput('number', String(match.number));
              core.setOutput('sha', match.head.sha);
              return;
            }
            const pr = pulls[0];
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);

      - name: Evaluate eligibility and enable auto-merge
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
          BASE_BRANCH: scaffold-gymsmart-erp-9743545895368865022
        run: |
          set -euo pipefail

          PR_JSON="$(gh pr view "$PR_NUMBER" --json number,title,author,isDraft,mergeable,baseRefName,headRefName,headRepository,headRepositoryOwner,url,files)"
          echo "Evaluating PR #$PR_NUMBER"

          AUTHOR="$(printf '%s' "$PR_JSON" | jq -r '.author.login')"
          IS_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.isDraft')"
          MERGEABLE="$(printf '%s' "$PR_JSON" | jq -r '.mergeable')"
          BASE_REF="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
          HEAD_OWNER="$(printf '%s' "$PR_JSON" | jq -r '.headRepositoryOwner.login')"
          HEAD_REPO="$(printf '%s' "$PR_JSON" | jq -r '.headRepository.name')"

          if [ "$AUTHOR" != "google-labs-jules[bot]" ]; then
            echo "Not a Jules bot PR (author=$AUTHOR). Skipping auto-merge."
            exit 0
          fi

          if [ "$HEAD_OWNER/$HEAD_REPO" != "${GITHUB_REPOSITORY}" ]; then
            echo "Fork PR detected ($HEAD_OWNER/$HEAD_REPO). Refusing auto-merge."
            exit 0
          fi

          if [ "$BASE_REF" != "$BASE_BRANCH" ]; then
            echo "Base branch is $BASE_REF, expected $BASE_BRANCH. Skipping."
            exit 0
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            echo "Draft PR. Skipping."
            exit 0
          fi

          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "Merge conflicts present. Fail closed."
            gh pr comment "$PR_NUMBER" --body "Auto-merge blocked: merge conflicts detected. Resolve conflicts and wait for green CI."
            exit 0
          fi

          # High-risk path gate (fail closed — do not auto-merge)
          HIGH_RISK=0
          while IFS= read -r path; do
            case "$path" in
              supabase/migrations/000008_security_hardening.sql|\
              supabase/migrations/000009_store_atomicity_and_membership_financial.sql|\
              .github/workflows/*|\
              AGENTS.md|\
              opencode.json)
                echo "High-risk path changed: $path"
                HIGH_RISK=1
                ;;
            esac
          done < <(printf '%s' "$PR_JSON" | jq -r '.files[].path')

          if [ "$HIGH_RISK" -eq 1 ]; then
            gh pr comment "$PR_NUMBER" --body "$(cat <<'EOF'
          **Auto-merge blocked (high-risk paths)**

          This Jules PR touches protected automation/security surfaces (e.g. migrations `000008`/`000009`, `.github/workflows/**`, `AGENTS.md`, or `opencode.json`).

          Automatic merge is **fail-closed** for these paths. A human must review and merge manually if appropriate.
          EOF
          )"
            exit 0
          fi

          # Verify CI check is green for this head SHA (belt-and-suspenders)
          CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name=="lint-typecheck-build") | .conclusion' | head -n1 || true)"
          if [ "$CONCLUSION" != "success" ]; then
            echo "CI check not successful (conclusion=${CONCLUSION:-missing}). Skipping."
            exit 0
          fi

          # Enable GitHub native auto-merge (squash). Requires repo setting allowing auto-merge.
          if gh pr merge "$PR_NUMBER" --auto --squash; then
            gh pr comment "$PR_NUMBER" --body "Auto-merge enabled (squash) after green CI. Jules bot PR only; high-risk paths not present."
          else
            echo "gh pr merge --auto failed (repo auto-merge may be disabled or checks pending). Fail closed."
            gh pr comment "$PR_NUMBER" --body "Could not enable auto-merge. Ensure repository **Allow auto-merge** is enabled and required checks include CI. Fail closed."
            exit 0
          fi
