# Guarded automatic merge for Jules-produced PRs only.
#
# Architecture: pure Octokit via actions/github-script.
# NO actions/checkout, NO gh CLI, NO local .git dependency.
#
# Trigger: only after CI workflow completes successfully on a pull_request.
# Merge: REST pulls.merge with exact HEAD SHA (fails if tip moved).
#
# Eligibility (ALL required):
# - Base = production branch
# - Not a fork
# - Not draft / closed / already merged
# - mergeable_state allows merge
# - Jules provenance (author OR any commit author/committer is google-labs-jules[bot])
# - CI check "lint-typecheck-build" success on the EXACT head SHA
# - No high-risk paths in the PR file list
#
# Never merges arbitrary/manual/external PRs.
name: auto-merge-jules

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  maybe-automerge:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate eligibility and merge via Octokit
        uses: actions/github-script@v7
        with:
          script: |
            const BASE_BRANCH = 'scaffold-gymsmart-erp-9743545895368865022';
            const CI_CHECK_NAME = 'lint-typecheck-build';
            const JULES_LOGIN = 'google-labs-jules[bot]';
            const HIGH_RISK = new Set([
              'supabase/migrations/000008_security_hardening.sql',
              'supabase/migrations/000009_store_atomicity_and_membership_financial.sql',
              'AGENTS.md',
              'opencode.json',
            ]);
            const isHighRiskPath = (p) =>
              HIGH_RISK.has(p) || p.startsWith('.github/workflows/');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;
            const headBranch = run.head_branch;

            // --- Resolve the open PR for this CI run (exact head SHA) ---
            let prNumber = null;
            const linked = run.pull_requests || [];
            for (const p of linked) {
              if (p.head && p.head.sha === headSha) {
                prNumber = p.number;
                break;
              }
            }
            if (!prNumber) {
              const { data: items } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${headBranch}`,
                per_page: 20,
              });
              const match = items.find((p) => p.head.sha === headSha);
              if (!match) {
                core.info(`No open PR for CI head ${headSha} on ${headBranch}; exit.`);
                return;
              }
              prNumber = match.number;
            }

            core.info(`Evaluating PR #${prNumber} at ${headSha}`);

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            // --- Structural gates ---
            if (pr.state !== 'open' || pr.merged) {
              core.info(`PR #${prNumber} not open (state=${pr.state}, merged=${pr.merged}).`);
              return;
            }
            if (pr.draft) {
              core.info(`PR #${prNumber} is draft.`);
              return;
            }
            if (pr.base.ref !== BASE_BRANCH) {
              core.info(`Base is ${pr.base.ref}, expected ${BASE_BRANCH}.`);
              return;
            }
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info(`Fork PR (${pr.head.repo.full_name}); refuse.`);
              return;
            }
            // Tip must still be the SHA CI validated
            if (pr.head.sha !== headSha) {
              core.info(
                `PR tip moved (${pr.head.sha} != CI ${headSha}); refuse (fail closed).`
              );
              return;
            }
            // mergeable can be null while GitHub computes; treat non-true carefully
            if (pr.mergeable === false) {
              core.info(`PR #${prNumber} not mergeable (conflicts).`);
              return;
            }

            // --- Jules provenance ---
            let isJules = pr.user && pr.user.login === JULES_LOGIN;
            if (!isJules) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });
              isJules = commits.some(
                (c) =>
                  (c.author && c.author.login === JULES_LOGIN) ||
                  (c.committer && c.committer.login === JULES_LOGIN)
              );
            }
            if (!isJules) {
              core.info(
                `Not a Jules PR (author=${pr.user && pr.user.login}); skip.`
              );
              return;
            }

            // --- High-risk files (paginate file list) ---
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const risky = files.map((f) => f.filename).filter(isHighRiskPath);
            if (risky.length) {
              core.warning(`High-risk paths; fail closed: ${risky.join(', ')}`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  '**Auto-merge blocked (high-risk paths)**\n\n' +
                  risky.map((p) => "- `" + p + "`").join("\n") +
                  '\n\nHuman review required. Safeguards were not weakened.',
              });
              return;
            }

            // --- CI check on exact SHA ---
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: headSha,
              check_name: CI_CHECK_NAME,
              status: 'completed',
              per_page: 20,
            });
            const ok = (checkRuns.check_runs || []).some(
              (cr) => cr.name === CI_CHECK_NAME && cr.conclusion === 'success'
            );
            if (!ok) {
              core.info(
                `No successful "${CI_CHECK_NAME}" on ${headSha}; skip.`
              );
              return;
            }

            // --- Merge with exact SHA (atomic tip check) ---
            try {
              const { data: result } = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: 'squash',
                sha: headSha,
                commit_title: `${pr.title} (#${prNumber})`,
              });
              if (result.merged) {
                core.info(`Merged PR #${prNumber} at ${headSha}.`);
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body:
                    'Auto-merged (squash) after green CI on exact HEAD SHA. ' +
                    'Jules-provenance verified; high-risk paths absent.',
                });
              } else {
                core.warning(`Merge not completed: ${result.message}`);
              }
            } catch (err) {
              // 405/409 when not mergeable or SHA mismatch — fail closed, do not throw job red for race
              const status = err.status || (err.response && err.response.status);
              core.warning(`Merge refused by API (${status}): ${err.message}`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  'Auto-merge attempted but GitHub refused the merge ' +
                  `(${status || 'unknown'}). Fail closed. ` +
                  'Re-run CI after resolving conflicts or tip movement if needed.',
              });
            }
