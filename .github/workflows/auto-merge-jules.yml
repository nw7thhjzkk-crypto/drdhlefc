# Guarded automatic merge for Jules-produced PRs only.
#
# Eligibility (ALL required):
# - Author is google-labs-jules[bot]
# - Head repo is this repository (not a fork)
# - Base is the production branch
# - CI workflow "CI" completed successfully for this head SHA
# - PR is mergeable (no conflicts)
# - High-risk paths are NOT modified (fail closed)
#
# Never merges arbitrary/manual/external PRs.
name: auto-merge-jules

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  maybe-automerge:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR for successful CI run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request_target') {
              core.setOutput('number', String(context.payload.pull_request.number));
              core.setOutput('sha', context.payload.pull_request.head.sha);
              return;
            }
            const run = context.payload.workflow_run;
            const pulls = run.pull_requests || [];
            if (!pulls.length) {
              const { data: items } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${run.head_branch}`,
                per_page: 10,
              });
              const match = items.find(p => p.head.sha === run.head_sha);
              if (!match) {
                core.setFailed('No open PR found for successful CI run');
                return;
              }
              core.setOutput('number', String(match.number));
              core.setOutput('sha', match.head.sha);
              return;
            }
            const pr = pulls[0];
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);

      - name: Evaluate eligibility and enable auto-merge
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
          BASE_BRANCH: scaffold-gymsmart-erp-9743545895368865022
        run: |
          set -euo pipefail

          PR_JSON="$(gh pr view "$PR_NUMBER" --json number,title,author,isDraft,mergeable,baseRefName,headRefName,headRepository,headRepositoryOwner,url,files)"
          echo "Evaluating PR #$PR_NUMBER"

          AUTHOR="$(printf '%s' "$PR_JSON" | jq -r '.author.login')"
          IS_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.isDraft')"
          MERGEABLE="$(printf '%s' "$PR_JSON" | jq -r '.mergeable')"
          BASE_REF="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
          HEAD_OWNER="$(printf '%s' "$PR_JSON" | jq -r '.headRepositoryOwner.login')"
          HEAD_REPO="$(printf '%s' "$PR_JSON" | jq -r '.headRepository.name')"

          COMMITS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits")"
          HAS_JULES_COMMIT="$(printf "%s" "$COMMITS_JSON" | jq '[.[] | select(.author.login == "google-labs-jules[bot]" or .committer.login == "google-labs-jules[bot]")] | length')"

          IS_JULES_PR="false"
          if [ "$AUTHOR" == "google-labs-jules[bot]" ]; then
            IS_JULES_PR="true"
          elif [ "$HAS_JULES_COMMIT" -gt 0 ]; then
            IS_JULES_PR="true"
          fi

          if [ "$IS_JULES_PR" != "true" ]; then
            echo "Not a Jules bot PR (author=$AUTHOR). Skipping auto-merge."
            bash -c 'exit 0'
          elif [ "$HEAD_OWNER/$HEAD_REPO" != "${GITHUB_REPOSITORY}" ]; then
            echo "Fork PR detected ($HEAD_OWNER/$HEAD_REPO). Refusing auto-merge."
            bash -c 'exit 0'
          elif [ "$BASE_REF" != "$BASE_BRANCH" ]; then
            echo "PR is not targeting production branch $BASE_BRANCH. Skipping auto-merge."
            bash -c 'exit 0'
          elif [ "$IS_DRAFT" == "true" ]; then
            echo "PR is a draft. Skipping auto-merge."
            bash -c 'exit 0'
          elif [ "$MERGEABLE" == "CONFLICTING" ]; then
            echo "PR has conflicts. Skipping auto-merge."
            bash -c 'exit 0'
          else
            HAS_HIGH_RISK=false
            while read -r FILE_PATH; do
              if [[ "$FILE_PATH" == .github/workflows/* ]] || \
                 [[ "$FILE_PATH" == "AGENTS.md" ]] || \
                 [[ "$FILE_PATH" == "opencode.json" ]] || \
                 [[ "$FILE_PATH" == supabase/migrations/000008_security_hardening.sql ]] || \
                 [[ "$FILE_PATH" == supabase/migrations/000009_store_atomicity_and_membership_financial.sql ]]; then
                echo "High-risk file modified: $FILE_PATH"
                HAS_HIGH_RISK=true
              fi
            done < <(printf '%s' "$PR_JSON" | jq -r '.files[].path')

            if [ "$HAS_HIGH_RISK" == "true" ]; then
              echo "High-risk changes detected. Failing closed. Human review and merge required."
              bash -c 'exit 1'
            else
              echo "PR $PR_NUMBER meets all criteria. Enabling auto-merge."
              gh pr merge "$PR_NUMBER" --auto --squash
            fi
          fi
